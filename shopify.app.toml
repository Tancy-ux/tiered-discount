client_id = "358a8b6e21a6099b9a021d128363e6b0"
name = "discount-tiers"
application_url = "https://tiered-discount-wy5b.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_discounts,read_customers"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://tiered-discount-wy5b.onrender.com/webhooks/customers/data_request"
  customer_deletion_url = "https://tiered-discount-wy5b.onrender.com/webhooks/customers/redact"
  shop_deletion_url = "https://tiered-discount-wy5b.onrender.com/webhooks/shop/redact"

[auth]
redirect_urls = [ "https://tiered-discount-wy5b.onrender.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
