query CartLinesDiscountsGenerateRunInput {
  # Shop currency → checkout currency. Tier amounts are in the shop currency.
  presentmentCurrencyRate
  discount {
    discountClasses
    # Set by the app when a code is limited to customers: their customer GIDs,
    # comma-separated. Empty/missing = anyone with the code.
    customerLock: metafield(namespace: "tiered_discount", key: "customer_id") {
      value
    }
    # Optional tiers for this code only, same JSON shape as the shop config.
    # Missing = the code uses the shop's default tiers.
    codeTiers: metafield(namespace: "tiered_discount", key: "tiers") {
      value
    }
  }
  cart {
    buyerIdentity {
      customer {
        id
      }
    }
    cost {
      subtotalAmount {
        amount
      }
    }
  }
  shop {
    # Shop-level metafield holding the configurable tier thresholds/percentages.
    # Merchants can edit this from Shopify admin → Settings → Custom data → Shop
    # (or via the metafieldsSet mutation) without any redeploy.
    metafield(namespace: "tiered_discount", key: "config") {
      value
    }
  }
}
